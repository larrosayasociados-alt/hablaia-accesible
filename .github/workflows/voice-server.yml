name: voice-server

on:
  pull_request:
  push:
    paths:
      - "server/**"
      - "config/persona/**"
      - "config/protocol-pin.json"
      - "config/backend/**"
      - ".github/workflows/voice-server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libopus
        run: sudo apt-get update && sudo apt-get install -y libopus0
      - name: Install Python packages
        run: python -m pip install -r server/requirements-dev.txt
      - name: Protocol tests
        working-directory: server
        run: python -m pytest -q
      - name: Preview check
        working-directory: server
        env:
          HABLAIA_TOKEN_SECRET: ci-not-a-real-secret
          HABLAIA_DEVICES: aa:bb:cc:dd:ee:ff
        run: python -m hablaia_server --check
