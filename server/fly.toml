# PREVIEW ONLY. Do not run `fly apps create`, `fly deploy`, `fly launch`,
# `fly secrets set`, or `fly certs`. Any of those can start billing.
# This file has no hostname. It must not be attached to hablaia.com.
# Alejandro has to approve a preview name before this Machine exists.
#
# Intended command, from the repository root, only after that approval:
#   fly deploy --config server/fly.toml --ha=false
# The Dockerfile path below is relative to the repository root.
# Region fra is Frankfurt. auto_stop is off so a voice socket is not
# closed just because the proxy wants to stop the Machine.

app = "hablaia-voice-preview"
primary_region = "fra"

[build]
  dockerfile = "server/Dockerfile"

[env]
  HABLAIA_BIND = "0.0.0.0:8787"
  HABLAIA_LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
